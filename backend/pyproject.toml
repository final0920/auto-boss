[project]
name = "boss-autoapply-backend"
version = "0.1.0"
description = "真机端自动筛选 + 半自动投递 Boss 直聘（AutoGLM 式 adb 原语 + 可插拔双后端 + webshell）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-socketio>=5.12",
    "uiautomator2>=3.2,<4",
    "langgraph>=0.2.60",
    "langchain-core>=0.3",
    "openai>=1.60",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.11,<4",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "httpx>=0.28",
    "rapidocr-onnxruntime>=1.4",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# anyio: only run asyncio backend (trio not installed)
anyio_backends = ["asyncio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
