[project]
name = "boss-autoapply-backend"
version = "0.1.0"
description = "Boss 直聘真机自动投递：结构化硬过滤 + LLM 打分 + root adb 投递 + 投递核对看板"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-socketio>=5.12",
    "uiautomator2>=3.2,<4",
    "openai>=1.60",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pillow>=11.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# anyio: only run asyncio backend (trio not installed)
anyio_backends = ["asyncio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
